syntax = "proto3";

package user.v1;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "codeup.aliyun.com/qimao/blog/ai-blog/backend/api/user;user";

// UserService 提供用户注册和资料管理接口。
service UserService {
  // Register 注册普通用户。
  rpc Register(RegisterRequest) returns (EmptyReply) {
    option (google.api.http) = {
      post: "/user/register"
      body: "*"
    };
  }

  // Login 使用手机号或昵称登录。
  rpc Login(LoginRequest) returns (LoginReply) {
    option (google.api.http) = {
      post: "/user/login"
      body: "*"
    };
  }

  // Logout 退出当前设备会话。
  rpc Logout(LogoutRequest) returns (EmptyReply) {
    option (google.api.http) = {
      post: "/auth/my/logout"
      body: "*"
    };
  }

  // GetMyProfile 查询当前登录用户资料。
  rpc GetMyProfile(GetMyProfileRequest) returns (ProfileReply) {
    option (google.api.http) = {get: "/auth/my/profile"};
  }

  // GetPublicProfile 查询指定用户的公开资料。
  rpc GetPublicProfile(GetPublicProfileRequest) returns (PublicProfileReply) {
    option (google.api.http) = {get: "/user/profile"};
  }

  // UpdateMyProfile 修改当前登录用户资料。
  rpc UpdateMyProfile(UpdateMyProfileRequest) returns (EmptyReply) {
    option (google.api.http) = {
      post: "/auth/my/profile/update"
      body: "*"
    };
  }

  // VerifyOldPassword 验证旧密码并获取一次性改密凭证。
  rpc VerifyOldPassword(VerifyOldPasswordRequest) returns (PasswordChangeTokenReply) {
    option (google.api.http) = {post: "/auth/my/password/verify" body: "*"};
  }

  // ChangePassword 使用一次性凭证修改密码。
  rpc ChangePassword(ChangePasswordRequest) returns (EmptyReply) {
    option (google.api.http) = {post: "/auth/my/password/change" body: "*"};
  }

  // UpdateMyAccount 修改当前用户手机号。
  rpc UpdateMyAccount(UpdateMyAccountRequest) returns (EmptyReply) {
    option (google.api.http) = {post: "/auth/my/account/update" body: "*"};
  }

  // GetAvatarUploadURL 获取头像直传凭证。
  rpc GetAvatarUploadURL(GetAvatarUploadURLRequest) returns (AvatarUploadReply) {
    option (google.api.http) = {post: "/auth/my/avatar/upload-url" body: "*"};
  }

  // ConfirmAvatar 确认头像对象。
  rpc ConfirmAvatar(ConfirmAvatarRequest) returns (AvatarUploadReply) {
    option (google.api.http) = {post: "/auth/my/avatar/confirm" body: "*"};
  }
}

// RegisterRequest 是用户注册请求。
message RegisterRequest {
  string nickname = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
  string phone = 2 [(validate.rules).string = {min_len: 1, max_len: 50}];
  string password = 3 [(validate.rules).string = {min_len: 6}];
}

// LoginRequest 是用户登录请求。
message LoginRequest {
  string phone = 1 [(validate.rules).string = {max_len: 50}];
  string nickname = 2 [(validate.rules).string = {max_len: 50}];
  string password = 3 [(validate.rules).string = {min_len: 1}];
  bool remember_me = 4;
  string device = 5 [(validate.rules).string = {max_len: 32}];
}

// LoginReply 是用户登录响应。
message LoginReply {
  string access_token = 1;
}

// LogoutRequest 是退出当前会话请求。
message LogoutRequest {}

// GetMyProfileRequest 是当前用户资料查询请求。
message GetMyProfileRequest {}

// GetPublicProfileRequest 是公开资料查询请求。
message GetPublicProfileRequest {
  uint64 user_id = 1 [(validate.rules).uint64 = {gt: 0}];
}

// UpdateMyProfileRequest 是当前用户资料修改请求。
message UpdateMyProfileRequest {
  string nickname = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
  string avatar = 2 [(validate.rules).string = {max_len: 255}];
}

message VerifyOldPasswordRequest {
  string old_password = 1 [(validate.rules).string = {min_len: 1}];
}

message PasswordChangeTokenReply { string change_token = 1; }

message ChangePasswordRequest {
  string change_token = 1 [(validate.rules).string = {min_len: 1}];
  string new_password = 2 [(validate.rules).string = {min_len: 6}];
}

message UpdateMyAccountRequest {
  string phone = 1 [(validate.rules).string = {min_len: 1, max_len: 50}];
}

message GetAvatarUploadURLRequest {
  string file_ext = 1 [(validate.rules).string = {min_len: 1, max_len: 16}];
}

message ConfirmAvatarRequest {
  string object_key = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
}

message AvatarUploadReply {
  string upload_url = 1;
  string object_key = 2;
  string avatar_url = 3;
}

// EmptyReply 表示业务成功但不返回数据。
message EmptyReply {}

// ProfileReply 是当前用户可见的完整资料。
message ProfileReply {
  uint64 id = 1;
  string nickname = 2;
  string avatar = 3;
  int32 role = 4;
  int64 last_login_time = 5;
  string last_login_ip = 6;
}

// PublicProfileReply 是游客可见的公开资料。
message PublicProfileReply {
  uint64 id = 1;
  string nickname = 2;
  string avatar = 3;
}
