syntax = "proto3";

package article.v1;

import "google/api/annotations.proto";
import "validate/validate.proto";

option go_package = "codeup.aliyun.com/qimao/blog/ai-blog/backend/api/article;article";

service ArticleService {
  rpc GetImageUploadURL(GetImageUploadURLRequest) returns (ImageUploadURLReply) {
    option (google.api.http) = { post: "/admin/article/image/upload-url" body: "*" };
  }
  rpc CreateArticle(CreateArticleRequest) returns (EmptyReply) {
    option (google.api.http) = { post: "/admin/article/create" body: "*" };
  }
  rpc GetMyArticleDetail(GetMyArticleDetailRequest) returns (ArticleDetailReply) {
    option (google.api.http) = { get: "/admin/article/me/detail" };
  }
  rpc UpdateArticle(UpdateArticleRequest) returns (EmptyReply) {
    option (google.api.http) = { post: "/admin/article/update" body: "*" };
  }
  rpc PublishArticle(ArticleIDRequest) returns (EmptyReply) {
    option (google.api.http) = { post: "/admin/article/publish" body: "*" };
  }
  rpc GetArticleDetail(ArticleIDRequest) returns (ArticleDetailReply) {
    option (google.api.http) = { get: "/optional/article/detail" };
  }
  rpc ListMyArticles(ArticleListRequest) returns (ArticleListReply) {
    option (google.api.http) = { get: "/admin/article/list" };
  }
  rpc MoveArticleToTrash(DeleteArticleRequest) returns (EmptyReply) {
    option (google.api.http) = { post: "/admin/article/delete" body: "*" };
  }
  rpc ListTrashArticles(ArticleListRequest) returns (ArticleListReply) {
    option (google.api.http) = { get: "/admin/article/trash/list" };
  }
  rpc RecoverArticle(ArticleIDRequest) returns (EmptyReply) {
    option (google.api.http) = { post: "/admin/article/trash/recover" body: "*" };
  }
  rpc ClearArticle(ArticleIDRequest) returns (EmptyReply) {
    option (google.api.http) = { post: "/admin/article/trash/clear" body: "*" };
  }
  rpc ListPublishedArticles(PublicArticleListRequest) returns (PublicArticleListReply) {
    option (google.api.http) = { get: "/article/list" };
  }
  rpc GetHotRank(EmptyRequest) returns (HotRankReply) {
    option (google.api.http) = { get: "/article/hot-rank" };
  }
}
message GetImageUploadURLRequest { string file_ext = 1 [(validate.rules).string = {min_len: 1, max_len: 10}]; }
message ImageUploadURLReply { uint64 image_id = 1; string upload_url = 2; string url = 3; }
message CreateArticleRequest {
  string title = 1 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string content = 2 [(validate.rules).string = {min_len: 1}];
  repeated string tags = 3;
  int32 status = 4 [(validate.rules).int32 = {in: [0, 2, 3]}];
}
message EmptyReply {}
message EmptyRequest {}
message GetMyArticleDetailRequest { uint64 id = 1 [(validate.rules).uint64 = {gt: 0}]; }
message UpdateArticleRequest {
  uint64 id = 1 [(validate.rules).uint64 = {gt: 0}];
  string title = 2 [(validate.rules).string = {min_len: 1, max_len: 255}];
  string content = 3 [(validate.rules).string = {min_len: 1}];
  repeated string tags = 4;
  int32 status = 5 [(validate.rules).int32 = {in: [0, 2, 3]}];
}
message ArticleIDRequest { uint64 id = 1 [(validate.rules).uint64 = {gt: 0}]; }
message DeleteArticleRequest { uint64 id = 1; }
message ArticleListRequest {
  int32 status = 1 [(validate.rules).int32 = {in: [-2, -1, 1, 2, 3]}];
  uint64 last_id = 2;
  uint64 page = 3;
  uint64 page_size = 4 [(validate.rules).uint64 = {ignore_empty: true, gte: 10, lte: 20}];
  bool is_desc = 5;
}
message ArticleListReply {
  repeated ArticleListItem list = 1;
  uint64 last_id = 2;
  uint64 total = 3;
  uint64 page = 4;
  uint64 page_size = 5;
}
message ArticleListItem {
  uint64 id = 1;
  string title = 2;
  repeated string tags = 3;
  int32 status = 4;
  int64 created_time = 5;
  int64 updated_time = 6;
}
message PublicArticleListRequest {
  uint64 last_id = 1;
  uint64 page = 2;
  uint64 page_size = 3 [(validate.rules).uint64 = {ignore_empty: true, gte: 10, lte: 20}];
  bool is_desc = 4;
}
message PublicArticleListReply {
  repeated PublicArticleListItem list = 1;
  uint64 last_id = 2;
  uint64 total = 3;
  uint64 page = 4;
  uint64 page_size = 5;
}
message PublicArticleListItem {
  uint64 id = 1;
  string title = 2;
  string summary = 3;
  uint64 author_id = 4;
  int64 updated_time = 5;
  int64 view_count = 6;
  int64 like_count = 7;
  int64 comment_count = 8;
}
message HotRankReply { repeated HotRankItem list = 1; }
message HotRankItem {
  uint64 article_id = 1;
  string title = 2;
  int64 hot = 3;
  int64 view_count = 4;
  int64 comment_count = 5;
  int64 like_count = 6;
}
message ArticleDetailReply {
  uint64 id = 1; string title = 2; string content = 3; repeated string tags = 4; int32 status = 5;
  string author_nick = 6; string author_avatar = 7; string ip = 8; int64 created_time = 9; int64 updated_time = 10;
  bool is_liked = 11; int64 like_count = 12; repeated ArticleImage images = 13;
}
message ArticleImage { uint64 id = 1; string url = 2; }
