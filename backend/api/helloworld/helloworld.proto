syntax = "proto3";

import "google/api/annotations.proto";


option go_package = "codeup.aliyun.com/qimao/blog/ai-blog/backend/api/helloworld;helloworld";
package helloworld;
service Greeter {

  // get /v1/SayHello
  rpc SayHello (HelloRequest) returns (HelloReply) {}

  rpc DoSome (HelloRequest) returns (HelloReply) {
    option (google.api.http) = {
      get: "/v1/DoSome",
    };
  }
}
message HelloRequest {
  string name = 1;
}
message HelloReply {
  string message = 1;
}
