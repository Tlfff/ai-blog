<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>CrewOps · Agent Orchestrator</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark"><svg width="19" height="19" viewBox="0 0 24 24" fill="none"><path d="M7 7h4V3H7a4 4 0 0 0-4 4v4h4V7Zm10-4h-4v4h4v4h4V7a4 4 0 0 0-4-4ZM7 13H3v4a4 4 0 0 0 4 4h4v-4H7v-4Zm14 0h-4v4h-4v4h4a4 4 0 0 0 4-4v-4Z" fill="currentColor"/></svg></div>
        <div><div class="brand-name">CrewOps</div><div class="brand-sub">Agent Orchestrator</div></div>
      </div>
      <button class="project-select" id="project-button"><svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H10l2 2h5.5A2.5 2.5 0 0 1 20 7.5v9A2.5 2.5 0 0 1 17.5 19h-11A2.5 2.5 0 0 1 4 16.5v-11Z" stroke="currentColor" stroke-width="1.7"/></svg><span id="project-name">ai-blog</span><span class="project-caret">⌄</span></button>
      <div class="top-spacer"></div>
      <div class="global-status"><span class="dot"></span><span id="global-status">服务正常 · 并发 0 / 2</span></div>
      <button class="icon-btn" id="global-search" aria-label="搜索"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button class="icon-btn" id="settings-button" aria-label="设置"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h10M18 7h2M4 17h2M10 17h10M14 4v6M6 14v6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></button>
      <button class="primary-btn" id="new-run-button"><span class="plus">＋</span>启动新工单</button>
    </header>
    <div class="shell">
      <aside class="sidebar">
        <div class="side-title">工作区</div>
        <nav id="workspace-nav"></nav>
        <div class="side-divider"></div>
        <div class="side-title" id="sidebar-section-title">最近运行</div>
        <div class="side-search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="m16 16 4 4" stroke="currentColor" stroke-width="1.7"/></svg><input id="sidebar-search" placeholder="搜索 Issue、运行或分支"></div>
        <div class="filter-row" id="sidebar-filters"></div>
        <div id="sidebar-list"></div>
        <div class="sidebar-footer"><strong>安全策略已启用</strong>独立 Worktree · 单一 Driver Thread<br>只读双轴审查 · 人工批准后才可提交</div>
      </aside>
      <main class="main" id="page-main"></main>
      <aside class="inspector" id="page-inspector"></aside>
    </div>
  </div>
  <div class="modal-layer" id="modal-layer" hidden><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
